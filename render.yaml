# Render Blueprint: https://render.com/docs/blueprint-spec
# One Docker web service on Render's free plan (no card needed). Free services sleep
# after about 15 idle minutes; consent grants, shared plans and sessions live in server
# memory and reset when it sleeps. Switch plan to starter for an always-on service.
services:
  - type: web
    name: doordarshi
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    numInstances: 1
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-tts
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.5-flash-lite
